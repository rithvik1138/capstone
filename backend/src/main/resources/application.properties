# ==============================================================================
# Cloud Infrastructure Monitoring and Logging System - Application Configuration
# ==============================================================================

spring.application.name=cloud-monitoring-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection (Configurable via Environment Variables)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:capstone}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rithvik1138}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CloudMonitoringHikariPool
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT Authentication Properties
# (Provide JWT_SECRET via environment variable in production; min 64 chars for HS512)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:c1e8477f198c61e89c6d3df858f7009e4d5808fef9b8b0938478d1ef396788ec25f9b4c09d57a9163cf743b1c67675f1a9b2b5284df24a5201a4e164495cb287}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.enrollment-token-ttl-minutes=30

# ------------------------------------------------------------------------------
# Prometheus Integration Properties
# ------------------------------------------------------------------------------
prometheus.base-url=${PROMETHEUS_URL:http://localhost:9090}
prometheus.scrape-interval-seconds=10

# ------------------------------------------------------------------------------
# OmniRoute AI Integration Properties (Backend only - Never expose to frontend)
# ------------------------------------------------------------------------------
omniroute.base-url=${OMNIROUTE_BASE_URL:https://api.omniroute.ai/v1}
omniroute.api-key=${OMNIROUTE_API_KEY:}
omniroute.default-model=${OMNIROUTE_MODEL:claude-3-5-sonnet-20241022}
omniroute.connect-timeout-ms=10000
omniroute.read-timeout-ms=45000

# ------------------------------------------------------------------------------
# CORS Allowed Origins
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ------------------------------------------------------------------------------
# Spring Boot Actuator & Metrics
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true