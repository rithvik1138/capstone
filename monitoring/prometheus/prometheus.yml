global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "spring-boot-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8080", "localhost:8080", "host.docker.internal:8080"]

  - job_name: "cloud-monitoring-agents"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "localhost:9100"
          - "127.0.0.1:9100"
          - "host.docker.internal:9100"
